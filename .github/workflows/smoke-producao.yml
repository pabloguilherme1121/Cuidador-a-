name: Smoke HTTPS - Cuidador(a)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar PWA publicado e privacidade
        env:
          BASE_URL: https://cuidadora-pwa.pabloguui21.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --silent --show-error --location --retry 3 --max-time 30 --output "$tmpdir/index.html" "$BASE_URL/"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 --output "$tmpdir/app.js" "$BASE_URL/app.js"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 --output "$tmpdir/sw.js" "$BASE_URL/sw.js"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 --output "$tmpdir/manifest.webmanifest" "$BASE_URL/manifest.webmanifest"
          grep -Fq 'Cuidador(a)' "$tmpdir/index.html"
          grep -Fq 'normalizePreferences' "$tmpdir/app.js"
          grep -Fq 'cuidadora-cache-v4' "$tmpdir/sw.js"
          grep -Fq 'standalone' "$tmpdir/manifest.webmanifest"
          curl --fail --location --retry 3 --max-time 30 --output /dev/null "$BASE_URL/assets/icon-192.png"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/.env.example")" = '404'
          echo 'PWA HTTPS, manifesto, JS, SW e proteção de arquivos privados: OK'
