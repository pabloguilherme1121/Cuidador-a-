name: Integracao real da Sala de Pacientes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-integration.yml'
      - 'tests/room-live.mjs'
      - 'room.mjs'
      - 'cloudflare/worker.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-room:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teste ponta a ponta Worker + D1 usando dados ficticios
        env:
          SITE_URL: https://cuidadora-pwa.pabloguui21.workers.dev
        run: node tests/room-live.mjs
